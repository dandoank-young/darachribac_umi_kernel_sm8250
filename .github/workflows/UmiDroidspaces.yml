name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'umi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'aosp'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 patch

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    # ============================================================
    # STEP: Apply Droidspaces patches for non-GKI (4.19) kernels
    # ============================================================
    - name: Apply Droidspaces Kernel Patches
      run: |
        set -e
        echo "==> Cloning Droidspaces-OSS to obtain non-GKI patches ..."

        # Clone shallowly to a temp directory. This avoids brittle raw URLs
        # and correctly preserves filenames containing spaces.
        rm -rf /tmp/Droidspaces-OSS
        git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS

        PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/non-GKI"

        echo "==> Available non-GKI patches:"
        ls -la "$PATCH_DIR"

        # Work from the kernel source root so the relative paths inside
        # the patches (net/netfilter/..., kernel/cgroup/...) resolve.
        cd "$GITHUB_WORKSPACE"
        echo "==> Kernel source root: $(pwd)"

        apply_patch() {
          local patch_file="$1"
          local label="$2"

          echo "==> Applying ${label} ..."

          # Try git apply first (understands a/ b/ git-style prefixes)
          if git apply --check "$patch_file" 2>/dev/null; then
            git apply "$patch_file"
            echo "    -> applied with git apply"
            return 0
          fi

          echo "    -> git apply --check failed, trying patch -p1 --forward ..."
          if patch -p1 --forward --batch < "$patch_file"; then
            echo "    -> applied with patch -p1"
            return 0
          fi

          echo "    !! ERROR: could not apply ${label}"
          return 1
        }

        # Iterate over every .patch file in the non-GKI directory.
        # Patches whose target file is absent from this kernel tree are
        # reported and skipped rather than failing the whole job.
        shopt -s nullglob
        for patch_file in "$PATCH_DIR"/*.patch; do
          patch_name="$(basename "$patch_file")"

          # Determine the first target path from the patch header so we can
          # check whether the file exists in this tree.
          target="$(grep -m1 '^diff --git ' "$patch_file" | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#')"

          if [ -z "$target" ]; then
            echo "==> Skipping ${patch_name}: could not determine target path from patch header."
            continue
          fi

          if [ ! -f "$target" ]; then
            echo "==> Skipping ${patch_name}: target '${target}' not present in this kernel tree."
            continue
          fi

          apply_patch "$patch_file" "$patch_name"
        done
        shopt -u nullglob

        echo "==> Droidspaces patch step complete."

    # ============================================================
    # STEP: Merge Droidspaces config into the device defconfig
    # ============================================================
    - name: Merge Droidspaces Config into Defconfig
      run: |
        set -e
        DEVICE="${{ github.event.inputs.device }}"
        echo "==> Locating defconfig for device: $DEVICE"

        # Try the two known locations.
        CANDIDATES=(
          "arch/arm64/configs/${DEVICE}_defconfig"
          "vendor/${DEVICE}_defconfig"
        )

        DEFCONFIG=""
        for c in "${CANDIDATES[@]}"; do
          if [ -f "$c" ]; then
            DEFCONFIG="$c"
            break
          fi
        done

        if [ -z "$DEFCONFIG" ]; then
          echo "!! ERROR: could not find defconfig for device $DEVICE."
          echo "   Looked in: ${CANDIDATES[*]}"
          echo "   Contents of arch/arm64/configs/:"
          ls -la arch/arm64/configs/ || true
          echo "   Contents of vendor/ (if any):"
          ls -la vendor/ 2>/dev/null || true
          exit 1
        fi

        echo "==> Using defconfig: $DEFCONFIG"

        # Backup original for reference
        cp "$DEFCONFIG" "${DEFCONFIG}.orig"

        # Helper: run the kernel's scripts/config against the defconfig.
        # This writes the correct syntax (# CONFIG_X is not set for =n,
        # CONFIG_X=y for =y, etc.) which `make defconfig` understands.
        sc() {
          ./scripts/config --file "$DEFCONFIG" "$@"
        }

        if [ ! -x scripts/config ]; then
          echo "!! ERROR: scripts/config not found. Is this a kernel source tree?"
          exit 1
        fi

        echo "==> Enabling mandatory Droidspaces options ..."

        # ---- IPC mechanisms ----
        sc --enable SYSCTL
        sc --enable SYSVIPC
        sc --enable POSIX_MQUEUE

        # ---- Core namespace support ----
        sc --enable NAMESPACES
        sc --enable PID_NS
        sc --enable UTS_NS
        sc --enable IPC_NS

        # ---- Seccomp ----
        sc --enable SECCOMP
        sc --enable SECCOMP_FILTER

        # ---- Control groups ----
        sc --enable CGROUPS
        sc --enable CGROUP_DEVICE
        sc --enable CGROUP_PIDS
        sc --enable MEMCG
        sc --enable CGROUP_SCHED
        sc --enable FAIR_GROUP_SCHED
        sc --enable CGROUP_FREEZER
        sc --enable CGROUP_NET_PRIO

        # ---- Device filesystem ----
        sc --enable DEVTMPFS

        # ---- OverlayFS ----
        sc --enable OVERLAY_FS

        # ---- tmpfs xattr / acl ----
        sc --enable TMPFS_POSIX_ACL
        sc --enable TMPFS_XATTR

        # ---- Firmware loader ----
        sc --enable FW_LOADER
        sc --enable FW_LOADER_USER_HELPER
        sc --enable FW_LOADER_COMPRESS

        # ---- Network isolation (NAT/none) ----
        sc --enable NET_NS
        sc --enable VETH
        sc --enable BRIDGE
        sc --enable NETFILTER
        sc --enable BRIDGE_NETFILTER
        sc --enable NETFILTER_ADVANCED
        sc --enable NF_CONNTRACK
        sc --enable IP_NF_IPTABLES
        sc --enable IP_NF_FILTER
        sc --enable NF_NAT
        sc --enable NF_TABLES
        sc --enable IP_NF_TARGET_MASQUERADE
        sc --enable NETFILTER_XT_TARGET_MASQUERADE
        sc --enable NETFILTER_XT_TARGET_TCPMSS
        sc --enable NETFILTER_XT_MATCH_ADDRTYPE
        sc --enable NF_CONNTRACK_NETLINK
        sc --enable NF_NAT_REDIRECT
        sc --enable IP_ADVANCED_ROUTER
        sc --enable IP_MULTIPLE_TABLES

        # ---- legacy 4.19-only symbols (may not exist on some trees) ----
        sc --enable NF_CONNTRACK_IPV4      || true
        sc --enable NF_NAT_IPV4            || true
        sc --enable IP_NF_NAT              || true

        # ---- Required DISABLE for internet to work on older kernels ----
        sc --disable ANDROID_PARANOID_NETWORK

        # ---- User namespaces (optional; only needed for Docker unsafe procfs) ----
        sc --disable USER_NS

        echo "==> Defconfig updated. Diff vs original:"
        diff -u "${DEFCONFIG}.orig" "$DEFCONFIG" || true

        echo "==> Final 60 lines of defconfig:"
        tail -n 60 "$DEFCONFIG"

    - name: Minimize Defconfig
      run: |
        set -e
        DEVICE="${{ github.event.inputs.device }}"
        DEFCONFIG="arch/arm64/configs/${DEVICE}_defconfig"

        if [ ! -f "$DEFCONFIG" ]; then
          echo "!! ERROR: $DEFCONFIG not found"
          exit 1
        fi

        # Use the same toolchain that build_kernel.sh uses (zyc-clang).
        export ARCH=arm64
        export PATH="$HOME/zyc-clang/bin:$PATH"

        # Detect the compiler prefix provided by zyc-clang.
        if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
          echo "==> Using zyc-clang's aarch64-linux-gnu- prefix"
          export CROSS_COMPILE=aarch64-linux-gnu-
        else
          echo "==> aarch64-linux-gnu-gcc not found; using clang --target"
          export CC="clang --target=aarch64-linux-gnu"
          export CROSS_COMPILE=""
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        fi

        # Run savedefconfig in a temp copy of the kernel tree so the
        # source root stays clean for build_kernel.sh (it refuses to
        # compile from out_aosp when the source tree has artifacts).
        TMP_TREE="/tmp/minimize-defconfig-$DEVICE"
        rm -rf "$TMP_TREE"
        cp -a . "$TMP_TREE"
        pushd "$TMP_TREE" > /dev/null

        echo "==> Loading device defconfig in temp tree: make ${DEVICE}_defconfig"
        make "${DEVICE}_defconfig"

        echo "==> Minimizing with savedefconfig"
        make savedefconfig

        if [ ! -f defconfig ]; then
          echo "!! ERROR: savedefconfig did not produce ./defconfig"
          popd > /dev/null
          exit 1
        fi

        popd > /dev/null

        # Only copy the resulting defconfig back — no artifacts leak.
        cp "$TMP_TREE/defconfig" "$DEFCONFIG"
        rm -rf "$TMP_TREE"

        echo "==> Minimized defconfig (${DEVICE}) — line count:"
        wc -l "$DEFCONFIG"
        echo "----- Tail of minimized defconfig -----"
        tail -n 40 "$DEFCONFIG"

        # Sanity check: confirm key Droidspaces options survived the minimize.
        echo "==> Verifying critical Droidspaces options are still enabled:"
        for opt in CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS \
                   CONFIG_SECCOMP CONFIG_CGROUPS CONFIG_MEMCG CONFIG_DEVTMPFS \
                   CONFIG_NET_NS CONFIG_VETH CONFIG_BRIDGE CONFIG_NETFILTER; do
          if grep -q "^${opt}=y" "$DEFCONFIG"; then
            echo "  [OK]   ${opt}=y"
          else
            echo "  [MISS] ${opt}  <-- review this!"
          fi
        done

    - name: Run Build Script
      run: |
        set -e
        chmod +x build_kernel.sh

        ARGS="${{ github.event.inputs.device }}"

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
