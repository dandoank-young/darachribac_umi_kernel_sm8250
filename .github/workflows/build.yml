name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'umi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'aosp'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 patch
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    # ============================================================
    # STEP: Apply Droidspaces patches for non-GKI (4.19) kernels
    # ============================================================
    - name: Apply Droidspaces Kernel Patches
      run: |
        echo "Downloading Droidspaces non-GKI patches..."
        mkdir -p /tmp/droidspaces-patches
        cd /tmp/droidspaces-patches
        
        # Download the two required patches from the Droidspaces-OSS repo
        curl -L -o 01.fix_kernel_panic_in_xt_qtaguid.patch \
          "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
        curl -L -o "02.fix_restore_cgroup_file_prefix_handling.patch" \
          "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
        
        # Return to the kernel source root
        cd $GITHUB_WORKSPACE
        
        # Apply patches with -p1 (as documented)
        echo "Applying patch 01..."
        patch -p1 < /tmp/droidspaces-patches/01.fix_kernel_panic_in_xt_qtaguid.patch
        
        echo "Applying patch 02..."
        patch -p1 < /tmp/droidspaces-patches/02.fix_restore_cgroup_file_prefix_handling.patch
        
        echo "Droidspaces patches applied successfully."

    # ============================================================
    # STEP: Merge Droidspaces config into your actual defconfig
    # ============================================================
    - name: Merge Droidspaces Config into Defconfig
      run: |
        echo "Injecting Droidspaces configuration requirements into defconfig..."
        
        # Use the actual defconfig path from your repository
        DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.device }}_defconfig"
        
        if [ ! -f "$DEFCONFIG" ]; then
          echo "ERROR: Defconfig not found at $DEFCONFIG"
          echo "Listing arch/arm64/configs/ directory for debugging:"
          ls -la arch/arm64/configs/ || true
          exit 1
        fi
        
        echo "Found defconfig at: $DEFCONFIG"
        
        # Append the mandatory Droidspaces options (from the official docs).
        # These are the options required for non-GKI kernels (3.18–4.19).
        cat >> "$DEFCONFIG" << 'EOF'

        # ------------------------------------------------------------------
        # Droidspaces mandatory configuration for non-GKI kernels (4.19)
        # Source: https://github.com/ravindu644/Droidspaces-OSS/blob/main/Documentation/Kernel-Configuration.md#configuring-non-gki-kernels-legacy-kernels
        # ------------------------------------------------------------------
        # IPC mechanisms
        CONFIG_SYSCTL=y
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        # Core namespace support
        CONFIG_NAMESPACES=y
        CONFIG_PID_NS=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        # Seccomp support
        CONFIG_SECCOMP=y
        CONFIG_SECCOMP_FILTER=y
        # Control groups support
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_MEMCG=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_FAIR_GROUP_SCHED=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_NET_PRIO=y
        # Device filesystem support
        CONFIG_DEVTMPFS=y
        # Overlay filesystem support (required for volatile mode)
        CONFIG_OVERLAY_FS=y
        # Enable xattr, posix acl support on tmpfs (For NixOS support)
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TMPFS_XATTR=y
        # Firmware loading support
        CONFIG_FW_LOADER=y
        CONFIG_FW_LOADER_USER_HELPER=y
        CONFIG_FW_LOADER_COMPRESS=y
        # Droidspaces Network Isolation Support - NAT/none modes
        CONFIG_NET_NS=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_NETFILTER=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_NF_CONNTRACK=y
        CONFIG_IP_NF_IPTABLES=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_NF_NAT=y
        CONFIG_NF_TABLES=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NF_CONNTRACK_NETLINK=y
        CONFIG_NF_NAT_REDIRECT=y
        CONFIG_IP_ADVANCED_ROUTER=y
        CONFIG_IP_MULTIPLE_TABLES=y
        # legacy compat
        CONFIG_NF_CONNTRACK_IPV4=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_IP_NF_NAT=y
        # Disable this on older kernels to make internet work
        CONFIG_ANDROID_PARANOID_NETWORK=n
        # Fix for docker unsafe procfs error
        CONFIG_USER_NS=y
        # ------------------------------------------------------------------
        EOF
        
        echo "Droidspaces configuration appended to $DEFCONFIG"
        echo "----- Last 50 lines of defconfig -----"
        tail -n 50 "$DEFCONFIG"

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
