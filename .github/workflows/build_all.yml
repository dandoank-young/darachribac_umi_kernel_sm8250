name: Build All Devices Kernel (Matrix Parallel + Release)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases (是否发布到 GitHub Releases)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build ${{ matrix.device }} | ${{ matrix.ksu && 'KSU' || 'NoKSU' }} (AOSP + MIUI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
        ksu:
          - true
          - false
        target_os:
          - aosp
          - miui

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 patch

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Merge Droidspaces Config into Defconfig
      run: |
        set -e
        DEVICE="${{ matrix.device }}"
        echo "==> Locating defconfig for device: $DEVICE"

        CANDIDATES=(
          "arch/arm64/configs/${DEVICE}_defconfig"
          "vendor/${DEVICE}_defconfig"
        )

        DEFCONFIG=""
        for c in "${CANDIDATES[@]}"; do
          if [ -f "$c" ]; then
            DEFCONFIG="$c"
            break
          fi
        done

        if [ -z "$DEFCONFIG" ]; then
          echo "!! ERROR: could not find defconfig for device $DEVICE."
          echo "   Looked in: ${CANDIDATES[*]}"
          echo "   Contents of arch/arm64/configs/:"
          ls -la arch/arm64/configs/ || true
          echo "   Contents of vendor/ (if any):"
          ls -la vendor/ 2>/dev/null || true
          exit 1
        fi

        echo "==> Using defconfig: $DEFCONFIG"

        cp "$DEFCONFIG" "${DEFCONFIG}.orig"

        sc() {
          ./scripts/config --file "$DEFCONFIG" "$@"
        }

        if [ ! -x scripts/config ]; then
          echo "!! ERROR: scripts/config not found. Is this a kernel source tree?"
          exit 1
        fi

        echo "==> Enabling mandatory Droidspaces options ..."

        # ---- IPC mechanisms ----
        sc --enable SYSCTL
        sc --enable SYSVIPC
        sc --enable POSIX_MQUEUE

        # ---- Core namespace support ----
        sc --enable NAMESPACES
        sc --enable PID_NS
        sc --enable UTS_NS
        sc --enable IPC_NS

        # ---- Seccomp ----
        sc --enable SECCOMP
        sc --enable SECCOMP_FILTER

        # ---- Control groups ----
        sc --enable CGROUPS
        sc --enable CGROUP_DEVICE
        sc --enable CGROUP_PIDS
        sc --enable MEMCG
        sc --enable CGROUP_SCHED
        sc --enable FAIR_GROUP_SCHED
        sc --enable CGROUP_FREEZER
        sc --enable CGROUP_NET_PRIO

        # ---- Device filesystem ----
        sc --enable DEVTMPFS

        # ---- OverlayFS ----
        sc --enable OVERLAY_FS

        # ---- tmpfs xattr / acl ----
        sc --enable TMPFS_POSIX_ACL
        sc --enable TMPFS_XATTR

        # ---- Firmware loader ----
        sc --enable FW_LOADER
        sc --enable FW_LOADER_USER_HELPER
        sc --enable FW_LOADER_COMPRESS

        # ---- Network isolation (NAT/none) ----
        sc --enable NET_NS
        sc --enable VETH
        sc --enable BRIDGE
        sc --enable NETFILTER
        sc --enable BRIDGE_NETFILTER
        sc --enable NETFILTER_ADVANCED
        sc --enable NF_CONNTRACK
        sc --enable IP_NF_IPTABLES
        sc --enable IP_NF_FILTER
        sc --enable NF_NAT
        sc --enable NF_TABLES
        sc --enable IP_NF_TARGET_MASQUERADE
        sc --enable NETFILTER_XT_TARGET_MASQUERADE
        sc --enable NETFILTER_XT_TARGET_TCPMSS
        sc --enable NETFILTER_XT_MATCH_ADDRTYPE
        sc --enable NF_CONNTRACK_NETLINK
        sc --enable NF_NAT_REDIRECT
        sc --enable IP_ADVANCED_ROUTER
        sc --enable IP_MULTIPLE_TABLES

        # ---- legacy 4.19-only symbols (may not exist on some trees) ----
        sc --enable NF_CONNTRACK_IPV4      || true
        sc --enable NF_NAT_IPV4            || true
        sc --enable IP_NF_NAT              || true

        # ---- Required DISABLE for internet to work on older kernels ----
        sc --disable ANDROID_PARANOID_NETWORK

        # ---- User namespaces (fixes Docker unsafe procfs) ----
        sc --enable USER_NS

        echo "==> Defconfig updated. Diff vs original:"
        diff -u "${DEFCONFIG}.orig" "$DEFCONFIG" || true

        echo "==> Final 60 lines of defconfig:"
        tail -n 60 "$DEFCONFIG"

    - name: Run Build Script
      id: build
      run: |
        set -o pipefail
        chmod +x build_kernel.sh

        ARGS="${{ matrix.device }}"

        if [ "${{ matrix.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        ARGS="$ARGS ${{ matrix.target_os }}"

        echo "Executing command: ./build_kernel.sh $ARGS"
        mkdir -p "$GITHUB_WORKSPACE/ci-logs"
        LOG="$GITHUB_WORKSPACE/ci-logs/build-${{ matrix.device }}-${{ matrix.ksu }}-${{ matrix.target_os }}.log"
        echo "Executing command: ./build_kernel.sh $ARGS" | tee "$LOG"
        ./build_kernel.sh $ARGS 2>&1 | tee -a "$LOG"
        echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        exit "${PIPESTATUS[0]}"

    - name: Upload Build Logs on Failure
      if: failure()
      run: |
        echo "Build failed. Uploading logs..."
        mkdir -p "$GITHUB_WORKSPACE/ci-logs"
        # Create a summary file with key info
        {
          echo "=== BUILD FAILURE SUMMARY ==="
          echo "Device: ${{ matrix.device }}"
          echo "KSU: ${{ matrix.ksu }}"
          echo "Target OS: ${{ matrix.target_os }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
          echo "Failed Step: ${GITHUB_STEP_NAME:-unknown}"
          echo "Timestamp: $(date -u)"
          echo ""
          echo "=== TAIL OF BUILD LOG (last 200 lines) ==="
          tail -n 200 "$GITHUB_WORKSPACE/ci-logs/build-${{ matrix.device }}-${{ matrix.ksu }}-${{ matrix.target_os }}.log" 2>/dev/null || echo "No build log found"
        } > "$GITHUB_WORKSPACE/ci-logs/failure-summary.txt"

    - name: Upload Build Logs Artifact
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs-${{ matrix.device }}-${{ matrix.ksu }}-${{ matrix.target_os }}-${{ github.run_id }}
        path: ci-logs/
        compression-level: 6
        retention-days: 7

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ matrix.device }}-${{ matrix.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0

    - name: Prepare Release Assets
      if: github.event.inputs.publish_release
      run: |
        mkdir -p all_kernels
        cp APTKernel_*.zip all_kernels/
        ls -la all_kernels/

    - name: Create Release Variables
      if: github.event.inputs.publish_release
      id: vars
      run: |
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: github.event.inputs.publish_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.vars.outputs.TAG_NAME }}
        name: "APTKernel Build - ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHA_SHORT }})"
        body: |
          ## 自动构建内核发布 / Automated Kernel Release

          - **构建日期 / Build Date:** ${{ steps.vars.outputs.BUILD_DATE }}
          - **提交哈希 / Commit SHA:** `${{ steps.vars.outputs.SHA_SHORT }}`
          - **支持设备 / Supported Devices:** `alioth, apollo, cas, cmi, dagu, elish, enuma, lmi, munch, pipa, psyche, thyme, umi`

          ---
          ### 刷机包分类指南 / Flashable ZIP Instructions:
          - **MIUI**: 适用于原厂 MIUI / HyperOS 或基于 MIUI 修改的第三方 ROM。
          - **AOSP**: 适用于 LineageOS 等类原生 AOSP ROM。
          - **ReSukiSU-SuSFS**: 集成 ReSukiSU 与 SuSFS。
          - **NoKernelSU**: 原版纯净内核，支持自行使用 Magisk 或 APatch 刷入。
        files: all_kernels/*.zip
